# ══════════════════════════════════════════════════════════════════════════════
# DRIFT DETECTION: nightly, read only, all production stacks.
# Catches portal and CLI changes that bypassed the pipeline. A failed run is
# the alert; wire the pipeline's failure notification to the team channel or
# to change management.
# ══════════════════════════════════════════════════════════════════════════════

name: 'Drift-$(Date:yyyyMMdd)$(Rev:.r)'

trigger: none
pr: none

schedules:
  - cron: '0 6 * * *'          # 06:00 UTC, 02:00 Toronto (EDT)
    displayName: 'Nightly drift check'
    branches:
      include: [main]
    always: true               # run even when nothing was committed

parameters:
  - name: environments
    type: object
    default: [prod]
  - name: stacks
    type: object
    default: [networking, keyvault, app]

variables:
  TF_VERSION: '1.16.3'
  STATE_RG: 'rg-terraform-state'
  TF_IN_AUTOMATION: 'true'

stages:
  - ${{ each env in parameters.environments }}:
      - stage: Drift_${{ env }}
        displayName: 'Drift: ${{ env }}'
        jobs:
          - ${{ each stack in parameters.stacks }}:
              - job: ${{ stack }}
                pool: {vmImage: ubuntu-latest}
                steps:
                  - template: templates/drift-steps.yml
                    parameters:
                      environmentName: ${{ env }}
                      stack: ${{ stack }}
