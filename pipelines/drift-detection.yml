# DRIFT DETECTION: nightly read only plan. A failed run is the alert.
# Which environments: driftEnvironments in templates/environments.yml

name: 'Drift-$(Date:yyyyMMdd)$(Rev:.r)'

trigger: none
pr: none

schedules:
  - cron: '0 6 * * *'          # 06:00 UTC, 02:00 Toronto (EDT)
    displayName: 'Nightly drift check'
    branches:
      include: [main]
    always: true

variables:
  TF_VERSION: '1.16.3'
  STATE_RG: 'rg-terraform-state'
  TF_IN_AUTOMATION: 'true'

stages:
  - template: templates/environments.yml
    parameters:
      mode: drift
