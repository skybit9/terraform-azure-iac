# ══════════════════════════════════════════════════════════════════════════════
# CD — Apply. Runs only on merge to main.
#
# STACK ORDER IS NOT OPTIONAL: app reads networking and keyvault outputs via
# terraform_remote_state, so those must be applied first or the app plan reads
# stale or missing outputs.
#
# This pipeline RE-PLANS rather than replaying the PR's plan artifact. Between
# the PR plan and the merge, another PR may have merged and changed state.
# The approver sees the fresh plan at the gate, then that exact binary applies.
# Branch policy "require branches to be up to date before merging" keeps the two
# plans near-identical.
# ══════════════════════════════════════════════════════════════════════════════

name: 'CD-Apply-$(Date:yyyyMMdd)$(Rev:.r)'

trigger:
  branches:
    include: [main]
  paths:
    include:
      - 'environments/**'
      - 'modules/**'

pr: none

variables:
  TF_VERSION: '1.9.8'
  STATE_RG: 'rg-terraform-state'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

stages:

# ── DEV ───────────────────────────────────────────────────────────────────────
  - stage: DevNetworking
    displayName: 'Dev: networking'
    jobs:
      - deployment: Apply
        environment: 'terraform-dev'        # approval gate lives on the Environment
        pool: { vmImage: 'ubuntu-latest' }
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: templates/apply-steps.yml
                  parameters: { environmentName: 'dev', stack: 'networking', stateStorageAccount: 'stishelartfstatedev' }

  - stage: DevKeyVault
    displayName: 'Dev: keyvault'
    dependsOn: DevNetworking
    condition: succeeded()
    jobs:
      - deployment: Apply
        environment: 'terraform-dev'
        pool: { vmImage: 'ubuntu-latest' }
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: templates/apply-steps.yml
                  parameters: { environmentName: 'dev', stack: 'keyvault', stateStorageAccount: 'stishelartfstatedev' }

  - stage: DevApp
    displayName: 'Dev: app'
    dependsOn: DevKeyVault
    condition: succeeded()
    jobs:
      - deployment: Apply
        environment: 'terraform-dev'
        pool: { vmImage: 'ubuntu-latest' }
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: templates/apply-steps.yml
                  parameters: { environmentName: 'dev', stack: 'app', stateStorageAccount: 'stishelartfstatedev' }

# ── STAGING ───────────────────────────────────────────────────────────────────
  - stage: StagingNetworking
    displayName: 'Staging: networking'
    dependsOn: DevApp
    condition: succeeded()
    jobs:
      - deployment: Apply
        environment: 'terraform-staging'
        pool: { vmImage: 'ubuntu-latest' }
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: templates/apply-steps.yml
                  parameters: { environmentName: 'staging', stack: 'networking', stateStorageAccount: 'stishelartfstatestaging' }

  - stage: StagingKeyVault
    displayName: 'Staging: keyvault'
    dependsOn: StagingNetworking
    condition: succeeded()
    jobs:
      - deployment: Apply
        environment: 'terraform-staging'
        pool: { vmImage: 'ubuntu-latest' }
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: templates/apply-steps.yml
                  parameters: { environmentName: 'staging', stack: 'keyvault', stateStorageAccount: 'stishelartfstatestaging' }

  - stage: StagingApp
    displayName: 'Staging: app'
    dependsOn: StagingKeyVault
    condition: succeeded()
    jobs:
      - deployment: Apply
        environment: 'terraform-staging'
        pool: { vmImage: 'ubuntu-latest' }
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: templates/apply-steps.yml
                  parameters: { environmentName: 'staging', stack: 'app', stateStorageAccount: 'stishelartfstatestaging' }

# ── PRODUCTION ────────────────────────────────────────────────────────────────
# terraform-prod Environment requires a senior approver. The applied-plan
# artifact from each stage is the CAB evidence package.
  - stage: ProdNetworking
    displayName: 'Prod: networking'
    dependsOn: StagingApp
    condition: succeeded()
    jobs:
      - deployment: Apply
        environment: 'terraform-prod'
        pool: { vmImage: 'ubuntu-latest' }
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: templates/apply-steps.yml
                  parameters: { environmentName: 'prod', stack: 'networking', stateStorageAccount: 'stishelartfstateprod' }

  - stage: ProdKeyVault
    displayName: 'Prod: keyvault'
    dependsOn: ProdNetworking
    condition: succeeded()
    jobs:
      - deployment: Apply
        environment: 'terraform-prod'
        pool: { vmImage: 'ubuntu-latest' }
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: templates/apply-steps.yml
                  parameters: { environmentName: 'prod', stack: 'keyvault', stateStorageAccount: 'stishelartfstateprod' }

  - stage: ProdApp
    displayName: 'Prod: app'
    dependsOn: ProdKeyVault
    condition: succeeded()
    jobs:
      - deployment: Apply
        environment: 'terraform-prod'
        pool: { vmImage: 'ubuntu-latest' }
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: templates/apply-steps.yml
                  parameters: { environmentName: 'prod', stack: 'app', stateStorageAccount: 'stishelartfstateprod' }
