# ══════════════════════════════════════════════════════════════════════════════
# CD: apply on merge to main.
#
# One stage per environment, so the Environment approval is asked ONCE per
# environment (checks are evaluated per stage). Inside, stacks apply in order:
# networking, keyvault, app. The order is required: app reads the other two
# through terraform_remote_state.
#
# CD re-plans inside the gate instead of replaying the PR artifact, so a PR
# merged in between cannot cause a stale plan to be applied. Branch policy
# "require branch up to date before merge" keeps the two plans near identical.
# ══════════════════════════════════════════════════════════════════════════════

name: 'CD-Apply-$(Date:yyyyMMdd)$(Rev:.r)'

trigger:
  branches:
    include: [main]
  paths:
    include: [environments, modules]

pr: none

variables:
  TF_VERSION: '1.16.3'
  STATE_RG: 'rg-terraform-state'
  TF_IN_AUTOMATION: 'true'

stages:
  - stage: dev
    displayName: 'Apply: dev'
    dependsOn: []
    jobs:
      - deployment: networking
        displayName: 'networking'
        environment: 'terraform-dev'
        pool: {vmImage: ubuntu-latest}
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/apply-steps.yml
                  parameters: {environmentName: dev, stack: networking}

      - deployment: keyvault
        displayName: 'keyvault'
        dependsOn: networking
        environment: 'terraform-dev'
        pool: {vmImage: ubuntu-latest}
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/apply-steps.yml
                  parameters: {environmentName: dev, stack: keyvault}

      - deployment: app
        displayName: 'app'
        dependsOn: keyvault
        environment: 'terraform-dev'
        pool: {vmImage: ubuntu-latest}
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/apply-steps.yml
                  parameters: {environmentName: dev, stack: app}

  - stage: staging
    displayName: 'Apply: staging'
    dependsOn: dev
    jobs:
      - deployment: networking
        displayName: 'networking'
        environment: 'terraform-staging'
        pool: {vmImage: ubuntu-latest}
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/apply-steps.yml
                  parameters: {environmentName: staging, stack: networking}

      - deployment: keyvault
        displayName: 'keyvault'
        dependsOn: networking
        environment: 'terraform-staging'
        pool: {vmImage: ubuntu-latest}
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/apply-steps.yml
                  parameters: {environmentName: staging, stack: keyvault}

      - deployment: app
        displayName: 'app'
        dependsOn: keyvault
        environment: 'terraform-staging'
        pool: {vmImage: ubuntu-latest}
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/apply-steps.yml
                  parameters: {environmentName: staging, stack: app}

  - stage: prod
    displayName: 'Apply: prod'
    dependsOn: staging
    jobs:
      - deployment: networking
        displayName: 'networking'
        environment: 'terraform-prod'
        pool: {vmImage: ubuntu-latest}
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/apply-steps.yml
                  parameters: {environmentName: prod, stack: networking}

      - deployment: keyvault
        displayName: 'keyvault'
        dependsOn: networking
        environment: 'terraform-prod'
        pool: {vmImage: ubuntu-latest}
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/apply-steps.yml
                  parameters: {environmentName: prod, stack: keyvault}

      - deployment: app
        displayName: 'app'
        dependsOn: keyvault
        environment: 'terraform-prod'
        pool: {vmImage: ubuntu-latest}
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/apply-steps.yml
                  parameters: {environmentName: prod, stack: app}
