# CD: apply on merge to main. One approval per environment, then
# shared/networking, shared/keyvault, and every workload RG.
# Environments and workload RGs: templates/environments.yml

name: 'CD-Apply-$(Date:yyyyMMdd)$(Rev:.r)'

trigger:
  branches:
    include: [main]
  paths:
    include: [environments, modules]

pr: none

variables:
  TF_VERSION: '1.16.3'
  STATE_RG: 'rg-terraform-state'
  TF_IN_AUTOMATION: 'true'

stages:
  - template: templates/environments.yml
    parameters:
      mode: cd
