# TEMPLATE: plan one stack (CI). Never applies. Uses the *-plan connection.

parameters:
  - name: environmentName
    type: string
  - name: stackPath        # shared/networking | shared/keyvault | rg/<resource-group>
    type: string
  - name: stackId          # networking | keyvault | lowercased RG name
    type: string

steps:
  - task: TerraformInstaller@1
    displayName: 'Install Terraform $(TF_VERSION)'
    inputs:
      terraformVersion: $(TF_VERSION)

  - task: AzureCLI@2
    displayName: 'Plan ${{ parameters.environmentName }}/${{ parameters.stackPath }}'
    inputs:
      azureSubscription: 'SVC-TF-${{ parameters.environmentName }}-${{ parameters.stackId }}-plan'
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}/${{ parameters.stackPath }}'
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail

        # Workload identity federation: the service connection supplies an OIDC
        # token. No client secret exists anywhere.
        export ARM_USE_OIDC=true
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_OIDC_TOKEN="$idToken"
        export ARM_TENANT_ID="$tenantId"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

        # Shared key access is disabled on the state accounts, so the backend
        # authenticates with Entra ID (use_azuread_auth).
        terraform init -input=false \
          -backend-config="resource_group_name=$(STATE_RG)" \
          -backend-config="storage_account_name=tfstate${{ parameters.environmentName }}001" \
          -backend-config="container_name=tfstate-${{ parameters.stackId }}" \
          -backend-config="key=terraform.tfstate" \
          -backend-config="use_oidc=true" \
          -backend-config="use_azuread_auth=true"

        # -lock=false is safe on a read only plan and never blocks a running
        # apply. Never used on apply.
        terraform plan -input=false -lock=false -out=tfplan.binary
        terraform show -json tfplan.binary > tfplan.json
        terraform show -no-color tfplan.binary > tfplan.txt

  # Scan the RESOLVED plan. venv because ubuntu-latest's system Python is
  # externally managed.
  - script: |
      set -euo pipefail
      python3 -m venv "$(Agent.TempDirectory)/checkov"
      "$(Agent.TempDirectory)/checkov/bin/pip" install --quiet checkov
      "$(Agent.TempDirectory)/checkov/bin/checkov" \
        -f tfplan.json \
        --framework terraform_plan \
        --config-file "$(Build.SourcesDirectory)/.checkov.yaml" \
        --output cli --output junitxml \
        --output-file-path console,checkov.xml
    displayName: 'Checkov ${{ parameters.environmentName }}/${{ parameters.stackPath }}'
    workingDirectory: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}/${{ parameters.stackPath }}'

  - task: PublishTestResults@2
    displayName: 'Publish Checkov results'
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}/${{ parameters.stackPath }}/checkov.xml'
      testRunTitle: 'Checkov ${{ parameters.environmentName }}-${{ parameters.stackId }}'

  - publish: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}/${{ parameters.stackPath }}/tfplan.txt'
    artifact: 'plan-${{ parameters.environmentName }}-${{ parameters.stackId }}-$(System.JobAttempt)'
    displayName: 'Publish plan for review'
