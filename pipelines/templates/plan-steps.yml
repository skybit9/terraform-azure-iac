# ══════════════════════════════════════════════════════════════════════════════
# TEMPLATE — plan one stack in one environment
#
# Auth is workload identity federation: the service connection supplies the
# OIDC token, so there is no client secret and no Key Vault lookup for ARM
# credentials. That is why AzureCLI@2 wraps the terraform calls: it exports
# the federated token into the environment.
# ══════════════════════════════════════════════════════════════════════════════

parameters:
  - name: environmentName
    type: string
  - name: stack
    type: string
  - name: stateStorageAccount
    type: string

steps:

  - task: TerraformInstaller@1
    displayName: 'Install Terraform'
    inputs:
      terraformVersion: $(TF_VERSION)

  - task: AzureCLI@2
    displayName: 'Plan ${{ parameters.environmentName }}/${{ parameters.stack }}'
    inputs:
      # Service connection naming matches bootstrap/04: SVC-TF-<env>-<stack>-plan
      azureSubscription: 'SVC-TF-${{ parameters.environmentName }}-${{ parameters.stack }}-plan'
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}/${{ parameters.stack }}'
      # addSpnToEnvironment exposes the federated token to the script so the
      # azurerm provider can use OIDC.
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail

        export ARM_USE_OIDC=true
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_OIDC_TOKEN="$idToken"
        export ARM_TENANT_ID="$tenantId"
        export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

        # Container per stack: the container IS the RBAC boundary, so the key
        # is simply terraform.tfstate inside it.
        terraform init \
          -backend-config="resource_group_name=$(STATE_RG)" \
          -backend-config="storage_account_name=${{ parameters.stateStorageAccount }}" \
          -backend-config="container_name=tfstate-${{ parameters.stack }}" \
          -backend-config="key=terraform.tfstate" \
          -backend-config="use_oidc=true"

        # -lock=false is safe on plan and avoids blocking a running apply.
        # Never use it on apply.
        terraform plan -lock=false -out=tfplan.binary
        terraform show -json tfplan.binary > tfplan.json
        terraform show -no-color tfplan.binary > tfplan.txt

  # Scan the RESOLVED plan, not raw HCL. Raw HCL misses values that only exist
  # after variables, locals, and module outputs are evaluated.
  - script: |
      pip install checkov --quiet
      checkov -f tfplan.json \
        --framework terraform_plan \
        --output cli --output junitxml \
        --output-file-path console,checkov.xml \
        --soft-fail-on MEDIUM,LOW \
        --hard-fail-on HIGH,CRITICAL
    displayName: 'Checkov: ${{ parameters.environmentName }}/${{ parameters.stack }}'
    workingDirectory: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}/${{ parameters.stack }}'

  - task: PublishTestResults@2
    displayName: 'Publish Checkov results'
    condition: always()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/environments/${{ parameters.environmentName }}/${{ parameters.stack }}/checkov.xml'
      testRunTitle: 'Checkov ${{ parameters.environmentName }}-${{ parameters.stack }}'

  - publish: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}/${{ parameters.stack }}/tfplan.txt'
    artifact: 'plan-${{ parameters.environmentName }}-${{ parameters.stack }}'
    displayName: 'Publish plan for review'
