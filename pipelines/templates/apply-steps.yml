# TEMPLATE: apply one stack (CD). Fresh plan inside the approval gate, then
# apply exactly that saved plan. Uses the *-apply connection.

parameters:
  - name: environmentName
    type: string
  - name: stackPath        # shared/networking | shared/keyvault | <resource-group>
    type: string
  - name: stackId          # networking | keyvault | lowercased RG name
    type: string

steps:
  - checkout: self

  - task: TerraformInstaller@1
    displayName: 'Install Terraform $(TF_VERSION)'
    inputs:
      terraformVersion: $(TF_VERSION)

  - task: AzureCLI@2
    displayName: 'Apply ${{ parameters.environmentName }}/${{ parameters.stackPath }}'
    inputs:
      azureSubscription: 'SVC-TF-${{ parameters.environmentName }}-${{ parameters.stackId }}-apply'
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}/${{ parameters.stackPath }}'
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail

        # Workload identity federation: the service connection supplies an OIDC
        # token. No client secret exists anywhere.
        export ARM_USE_OIDC=true
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_OIDC_TOKEN="$idToken"
        export ARM_TENANT_ID="$tenantId"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

        # Shared key access is disabled on the state accounts, so the backend
        # authenticates with Entra ID (use_azuread_auth).
        terraform init -input=false \
          -backend-config="resource_group_name=$(STATE_RG)" \
          -backend-config="storage_account_name=tfstate${{ parameters.environmentName }}001" \
          -backend-config="container_name=tfstate-${{ parameters.stackId }}" \
          -backend-config="key=terraform.tfstate" \
          -backend-config="use_oidc=true" \
          -backend-config="use_azuread_auth=true"

        terraform plan -input=false -lock-timeout=5m -out=apply.binary
        terraform show -no-color apply.binary > applied-plan.txt
        cat applied-plan.txt

        # A saved plan is already an approved decision: no -auto-approve.
        terraform apply -input=false -lock-timeout=5m apply.binary

  - publish: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}/${{ parameters.stackPath }}/applied-plan.txt'
    artifact: 'applied-${{ parameters.environmentName }}-${{ parameters.stackId }}-$(System.JobAttempt)'
    displayName: 'Publish applied plan (audit evidence)'
    condition: always()

  - script: |
      echo "Apply failed. Apply is not transactional: resources created before"
      echo "the failure remain in Azure and in state. Fix the root cause and"
      echo "re-run; Terraform applies only the delta. If Azure created a"
      echo "resource that state missed, reconcile with terraform import first."
    displayName: 'Partial failure guidance'
    condition: failed()
