# ══════════════════════════════════════════════════════════════════════════════
# TEMPLATE: apply one stack in one environment (CD).
# Inside the approval gate: init, fresh plan, apply exactly that saved plan.
# Uses the *-apply service connection: Contributor on the resource group.
# ══════════════════════════════════════════════════════════════════════════════

parameters:
  - name: environmentName
    type: string
  - name: stack
    type: string

steps:
  - checkout: self

  - task: TerraformInstaller@1
    displayName: 'Install Terraform $(TF_VERSION)'
    inputs:
      terraformVersion: $(TF_VERSION)

  - task: AzureCLI@2
    displayName: 'Apply ${{ parameters.environmentName }}/${{ parameters.stack }}'
    inputs:
      azureSubscription: 'SVC-TF-${{ parameters.environmentName }}-${{ parameters.stack }}-apply'
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}/${{ parameters.stack }}'
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail

        # Workload identity federation: the service connection supplies an OIDC
        # token. No client secret exists anywhere.
        export ARM_USE_OIDC=true
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_OIDC_TOKEN="$idToken"
        export ARM_TENANT_ID="$tenantId"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

        # use_azuread_auth: the state accounts have shared key access disabled,
        # so the backend must authenticate with Entra ID, not account keys.
        terraform init -input=false \
          -backend-config="resource_group_name=$(STATE_RG)" \
          -backend-config="storage_account_name=tfstate${{ parameters.environmentName }}001" \
          -backend-config="container_name=tfstate-${{ parameters.stack }}" \
          -backend-config="key=terraform.tfstate" \
          -backend-config="use_oidc=true" \
          -backend-config="use_azuread_auth=true"

        # State lock IS taken. -lock-timeout waits for a held lock instead of
        # failing instantly.
        terraform plan -input=false -lock-timeout=5m -out=apply.binary
        terraform show -no-color apply.binary > applied-plan.txt
        cat applied-plan.txt

        # A saved plan file is already an approved decision: no -auto-approve.
        terraform apply -input=false -lock-timeout=5m apply.binary

  # Audit evidence referenced by the change record.
  - publish: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}/${{ parameters.stack }}/applied-plan.txt'
    artifact: 'applied-${{ parameters.environmentName }}-${{ parameters.stack }}-$(System.JobAttempt)'
    displayName: 'Publish applied plan (audit evidence)'
    condition: always()

  - script: |
      echo "Apply failed. Apply is not transactional: resources created before"
      echo "the failure remain in Azure and in state. Fix the root cause and"
      echo "re-run; Terraform applies only the delta. If Azure created a"
      echo "resource that state missed, reconcile with terraform import first."
    displayName: 'Partial failure guidance'
    condition: failed()
