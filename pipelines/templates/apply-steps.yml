# ══════════════════════════════════════════════════════════════════════════════
# TEMPLATE — apply one stack in one environment
#
# Sequence inside the approval gate: init, fresh plan, apply that saved plan.
# Applying a saved binary means Terraform cannot decide to do something
# different between the plan the approver saw and the apply.
# ══════════════════════════════════════════════════════════════════════════════

parameters:
  - name: environmentName
    type: string
  - name: stack
    type: string
  - name: stateStorageAccount
    type: string

steps:

  - task: TerraformInstaller@1
    displayName: 'Install Terraform'
    inputs:
      terraformVersion: $(TF_VERSION)

  - task: AzureCLI@2
    displayName: 'Apply ${{ parameters.environmentName }}/${{ parameters.stack }}'
    inputs:
      azureSubscription: 'SVC-TF-${{ parameters.environmentName }}-${{ parameters.stack }}-apply'
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}/${{ parameters.stack }}'
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail

        export ARM_USE_OIDC=true
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_OIDC_TOKEN="$idToken"
        export ARM_TENANT_ID="$tenantId"
        export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

        terraform init \
          -backend-config="resource_group_name=$(STATE_RG)" \
          -backend-config="storage_account_name=${{ parameters.stateStorageAccount }}" \
          -backend-config="container_name=tfstate-${{ parameters.stack }}" \
          -backend-config="key=terraform.tfstate" \
          -backend-config="use_oidc=true"

        # Lock IS taken here. -lock-timeout waits rather than failing instantly
        # if another run holds it.
        terraform plan -lock-timeout=5m -out=apply.binary
        terraform show -no-color apply.binary > applied-plan.txt

        echo "===== PLAN TO BE APPLIED ====="
        cat applied-plan.txt

        # No -auto-approve needed: a saved plan file is already an approved
        # decision, so Terraform will not prompt.
        terraform apply -lock-timeout=5m apply.binary

  # Audit evidence, referenced by the change record for SOX and PCI DSS.
  - publish: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}/${{ parameters.stack }}/applied-plan.txt'
    artifact: 'applied-${{ parameters.environmentName }}-${{ parameters.stack }}-$(Build.BuildId)'
    displayName: 'Publish applied plan as audit evidence'
    condition: always()

  - script: |
      echo "Apply failed. Terraform apply is not transactional: resources created"
      echo "before the failure remain in Azure and in state."
      echo "Recovery: fix the root cause and re-run. Terraform applies only the delta."
      echo "If Azure created a resource but state missed it, reconcile with terraform import."
    displayName: 'Partial-failure guidance'
    condition: failed()
