# ══════════════════════════════════════════════════════════════════════════════
# REUSABLE TEMPLATE — apply steps for one environment
#
# Sequence inside the approval gate:
#   1. init      (state lock acquired here)
#   2. plan      (fresh, saved to binary)
#   3. apply     (the binary from step 2, never a bare apply)
#
# Applying a saved binary rather than 'terraform apply -auto-approve' means
# Terraform cannot decide to do something different between plan and apply.
# ══════════════════════════════════════════════════════════════════════════════

parameters:
  - name: environmentName
    type: string
  - name: serviceConnection
    type: string
  - name: keyVaultName
    type: string

steps:

  - task: TerraformInstaller@1
    displayName: 'Install Terraform'
    inputs:
      terraformVersion: $(TF_VERSION)

  - task: AzureKeyVault@2
    displayName: 'Pull ARM credentials (${{ parameters.environmentName }})'
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      KeyVaultName: ${{ parameters.keyVaultName }}
      SecretsFilter: 'ARM-CLIENT-ID,ARM-CLIENT-SECRET,ARM-TENANT-ID,ARM-SUBSCRIPTION-ID'
      RunAsPreJob: true

  - script: |
      terraform init \
        -backend-config="resource_group_name=$(BACKEND_RG)" \
        -backend-config="storage_account_name=$(BACKEND_SA)" \
        -backend-config="container_name=$(BACKEND_CONTAINER)" \
        -backend-config="key=${{ parameters.environmentName }}.terraform.tfstate"
    displayName: 'Init (${{ parameters.environmentName }})'
    workingDirectory: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}'
    env:
      ARM_CLIENT_ID: $(ARM-CLIENT-ID)
      ARM_CLIENT_SECRET: $(ARM-CLIENT-SECRET)
      ARM_TENANT_ID: $(ARM-TENANT-ID)
      ARM_SUBSCRIPTION_ID: $(ARM-SUBSCRIPTION-ID)

  - script: |
      # Fresh plan against current state. Lock IS taken here (no -lock=false).
      # -lock-timeout waits rather than failing instantly if another run holds it.
      terraform plan \
        -lock-timeout=5m \
        -var-file=terraform.tfvars \
        -out=apply-${{ parameters.environmentName }}.binary

      terraform show -no-color apply-${{ parameters.environmentName }}.binary \
        > apply-${{ parameters.environmentName }}.txt

      echo "===== PLAN TO BE APPLIED ====="
      cat apply-${{ parameters.environmentName }}.txt
    displayName: 'Plan (fresh, pre-apply)'
    workingDirectory: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}'
    env:
      ARM_CLIENT_ID: $(ARM-CLIENT-ID)
      ARM_CLIENT_SECRET: $(ARM-CLIENT-SECRET)
      ARM_TENANT_ID: $(ARM-TENANT-ID)
      ARM_SUBSCRIPTION_ID: $(ARM-SUBSCRIPTION-ID)

  - script: |
      # Apply the SAVED binary. No -auto-approve needed: a saved plan file is
      # already an approved decision, Terraform will not prompt.
      terraform apply -lock-timeout=5m apply-${{ parameters.environmentName }}.binary
    displayName: 'Apply (${{ parameters.environmentName }})'
    workingDirectory: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}'
    env:
      ARM_CLIENT_ID: $(ARM-CLIENT-ID)
      ARM_CLIENT_SECRET: $(ARM-CLIENT-SECRET)
      ARM_TENANT_ID: $(ARM-TENANT-ID)
      ARM_SUBSCRIPTION_ID: $(ARM-SUBSCRIPTION-ID)

  # Audit evidence. Retained per the pipeline's retention policy and referenced
  # by the change record for SOX / PCI DSS traceability.
  - publish: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}/apply-${{ parameters.environmentName }}.txt'
    artifact: 'applied-plan-${{ parameters.environmentName }}-$(Build.BuildId)'
    displayName: 'Publish applied plan as audit evidence'
    condition: always()

  # On failure, surface what partially applied. Terraform apply is NOT
  # transactional: resources created before the failure remain and are in state.
  - script: |
      echo "Apply failed. Resources created before the failure remain in Azure and in state."
      echo "Recovery: fix root cause, re-run. Terraform is idempotent and will apply only the delta."
      echo "If Azure created a resource but state missed it, reconcile with terraform import first."
    displayName: 'Partial-failure guidance'
    condition: failed()
