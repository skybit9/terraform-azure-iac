# ══════════════════════════════════════════════════════════════════════════════
# TEMPLATE: drift check one stack (read only, uses the *-plan connection).
#   exit 0 = matches code   exit 1 = error   exit 2 = drift
# ══════════════════════════════════════════════════════════════════════════════

parameters:
  - name: environmentName
    type: string
  - name: stack
    type: string

steps:
  - task: TerraformInstaller@1
    displayName: 'Install Terraform $(TF_VERSION)'
    inputs:
      terraformVersion: $(TF_VERSION)

  - task: AzureCLI@2
    displayName: 'Drift check ${{ parameters.environmentName }}/${{ parameters.stack }}'
    inputs:
      azureSubscription: 'SVC-TF-${{ parameters.environmentName }}-${{ parameters.stack }}-plan'
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}/${{ parameters.stack }}'
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail

        # Workload identity federation: the service connection supplies an OIDC
        # token. No client secret exists anywhere.
        export ARM_USE_OIDC=true
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_OIDC_TOKEN="$idToken"
        export ARM_TENANT_ID="$tenantId"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

        # use_azuread_auth: the state accounts have shared key access disabled,
        # so the backend must authenticate with Entra ID, not account keys.
        terraform init -input=false \
          -backend-config="resource_group_name=$(STATE_RG)" \
          -backend-config="storage_account_name=tfstate${{ parameters.environmentName }}001" \
          -backend-config="container_name=tfstate-${{ parameters.stack }}" \
          -backend-config="key=terraform.tfstate" \
          -backend-config="use_oidc=true" \
          -backend-config="use_azuread_auth=true"

        # set -e would abort on exit code 2, so capture it explicitly.
        set +e
        terraform plan -input=false -lock=false -detailed-exitcode -no-color > drift.txt 2>&1
        CODE=$?
        set -e
        cat drift.txt

        if [ "$CODE" -eq 0 ]; then
          echo "No drift: Azure matches the code."
        elif [ "$CODE" -eq 2 ]; then
          echo "##vso[task.logissue type=error]Drift detected in ${{ parameters.environmentName }}/${{ parameters.stack }}."
          exit 1
        else
          echo "##vso[task.logissue type=error]terraform plan errored (exit $CODE)."
          exit "$CODE"
        fi

  - publish: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}/${{ parameters.stack }}/drift.txt'
    artifact: 'drift-${{ parameters.environmentName }}-${{ parameters.stack }}-$(System.JobAttempt)'
    displayName: 'Publish drift report'
    condition: always()
