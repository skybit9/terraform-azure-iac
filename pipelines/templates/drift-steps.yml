# TEMPLATE: drift check one stack. Read only, *-plan connection.
#   exit 0 = matches code   exit 1 = error   exit 2 = drift

parameters:
  - name: environmentName
    type: string
  - name: stackPath        # shared/networking | shared/keyvault | <resource-group>
    type: string
  - name: stackId          # networking | keyvault | lowercased RG name
    type: string

steps:
  - task: TerraformInstaller@1
    displayName: 'Install Terraform $(TF_VERSION)'
    inputs:
      terraformVersion: $(TF_VERSION)

  - task: AzureCLI@2
    displayName: 'Drift check ${{ parameters.environmentName }}/${{ parameters.stackPath }}'
    inputs:
      azureSubscription: 'SVC-TF-${{ parameters.environmentName }}-${{ parameters.stackId }}-plan'
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}/${{ parameters.stackPath }}'
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail

        # Workload identity federation: the service connection supplies an OIDC
        # token. No client secret exists anywhere.
        export ARM_USE_OIDC=true
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_OIDC_TOKEN="$idToken"
        export ARM_TENANT_ID="$tenantId"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

        # Shared key access is disabled on the state accounts, so the backend
        # authenticates with Entra ID (use_azuread_auth).
        terraform init -input=false \
          -backend-config="resource_group_name=$(STATE_RG)" \
          -backend-config="storage_account_name=tfstate${{ parameters.environmentName }}001" \
          -backend-config="container_name=tfstate-${{ parameters.stackId }}" \
          -backend-config="key=terraform.tfstate" \
          -backend-config="use_oidc=true" \
          -backend-config="use_azuread_auth=true"

        set +e
        terraform plan -input=false -lock=false -detailed-exitcode -no-color > drift.txt 2>&1
        CODE=$?
        set -e
        cat drift.txt
        if [ "$CODE" -eq 0 ]; then
          echo "No drift."
        elif [ "$CODE" -eq 2 ]; then
          echo "##vso[task.logissue type=error]Drift detected in ${{ parameters.environmentName }}/${{ parameters.stackPath }}."
          exit 1
        else
          echo "##vso[task.logissue type=error]terraform plan errored (exit $CODE)."
          exit "$CODE"
        fi

  - publish: '$(Build.SourcesDirectory)/environments/${{ parameters.environmentName }}/${{ parameters.stackPath }}/drift.txt'
    artifact: 'drift-${{ parameters.environmentName }}-${{ parameters.stackId }}-$(System.JobAttempt)'
    displayName: 'Publish drift report'
    condition: always()
