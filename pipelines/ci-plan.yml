# ══════════════════════════════════════════════════════════════════════════════
# CI PIPELINE — Dry Run (terraform plan only, NEVER applies)
#
# Branch strategy:
#   feature/*  -> PR raised against main -> THIS pipeline runs
#   main       -> merge                  -> cd-apply.yml runs
#
# Identity: service connection bound to a Reader + state-write SPN.
# A plan does not need Contributor. Keeping CI read-only means a malicious
# PR cannot add an apply step and escalate.
# ══════════════════════════════════════════════════════════════════════════════

name: 'CI-Plan-$(Build.SourceBranchName)-$(Date:yyyyMMdd)$(Rev:.r)'

# Do NOT run on merge to main; that is CD's job.
trigger: none

# Run on every PR targeting main, and on every push to that PR branch.
pr:
  branches:
    include:
      - main
  paths:
    include:
      - 'environments/**'
      - 'modules/**'

variables:
  TF_VERSION: '1.9.8'
  BACKEND_RG: 'rg-terraform-state'
  BACKEND_SA: 'stterraformstate'
  BACKEND_CONTAINER: 'tfstate'
  # Never echo secrets; all ARM_* values come from Key Vault at runtime.
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

stages:

# ── STAGE 1: STATIC CHECKS (no Azure access needed) ───────────────────────────
  - stage: Validate
    displayName: 'Validate: fmt, lint, security'
    jobs:
      - job: Static
        displayName: 'Static analysis'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            fetchDepth: 0                      # full history so we can diff vs main

          - task: TerraformInstaller@1
            displayName: 'Install Terraform $(TF_VERSION)'
            inputs:
              terraformVersion: $(TF_VERSION)

          - script: terraform fmt -check -recursive
            displayName: 'Format check'
            # Fails if any .tf file is unformatted. Cheapest gate, run first.

          - script: |
              set -e
              for env in dev staging prod; do
                echo "Validating $env"
                cd $(Build.SourcesDirectory)/environments/$env
                terraform init -backend=false     # no backend: syntax check only
                terraform validate
                cd -
              done
            displayName: 'Terraform validate (all environments)'

          - script: |
              curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
              tflint --init
              tflint --recursive --format compact
            displayName: 'TFLint'

# ── STAGE 2: PLAN PER ENVIRONMENT ─────────────────────────────────────────────
# One job per environment. They run in PARALLEL (no dependsOn between jobs)
# because a plan is read-only and they touch different state files.
  - stage: Plan
    displayName: 'Plan: dev, staging, prod'
    dependsOn: Validate
    condition: succeeded()
    jobs:

      - job: PlanDev
        displayName: 'Plan Dev'
        pool:
          vmImage: 'ubuntu-latest'
        variables:
          ENV_NAME: 'dev'
        steps:
          - template: templates/plan-steps.yml
            parameters:
              environmentName: 'dev'
              serviceConnection: 'SVC-Terraform-Dev-Reader'
              keyVaultName: 'kv-terraform-dev'

      - job: PlanStaging
        displayName: 'Plan Staging'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - template: templates/plan-steps.yml
            parameters:
              environmentName: 'staging'
              serviceConnection: 'SVC-Terraform-Staging-Reader'
              keyVaultName: 'kv-terraform-staging'

      - job: PlanProd
        displayName: 'Plan Production'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - template: templates/plan-steps.yml
            parameters:
              environmentName: 'prod'
              serviceConnection: 'SVC-Terraform-Prod-Reader'
              keyVaultName: 'kv-terraform-prod'

# ── STAGE 3: POST PLAN SUMMARY TO THE PULL REQUEST ────────────────────────────
  - stage: PRComment
    displayName: 'Post plan summary to PR'
    dependsOn: Plan
    condition: succeeded()
    jobs:
      - job: Comment
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - download: current
            artifact: plan-prod-json

          - script: |
              # Summarise the plan so the reviewer sees the blast radius in the PR
              # without downloading an artifact. Counts come from the plan JSON.
              CREATE=$(jq '[.resource_changes[] | select(.change.actions[0]=="create")] | length' \
                $(Pipeline.Workspace)/plan-prod-json/plan-prod.json)
              UPDATE=$(jq '[.resource_changes[] | select(.change.actions[0]=="update")] | length' \
                $(Pipeline.Workspace)/plan-prod-json/plan-prod.json)
              DELETE=$(jq '[.resource_changes[] | select(.change.actions[0]=="delete")] | length' \
                $(Pipeline.Workspace)/plan-prod-json/plan-prod.json)

              # A replace shows as ["delete","create"] — the dangerous case.
              REPLACE=$(jq '[.resource_changes[] | select(.change.actions==["delete","create"])] | length' \
                $(Pipeline.Workspace)/plan-prod-json/plan-prod.json)

              echo "Prod plan: $CREATE to add, $UPDATE to change, $DELETE to destroy, $REPLACE to replace"

              # Fail the PR if anything would be destroyed or replaced in Production
              # without an explicit override label on the PR.
              if [ "$DELETE" -gt 0 ] || [ "$REPLACE" -gt 0 ]; then
                echo "##vso[task.logissue type=warning]Production plan contains destroy or replace operations. Senior review required."
              fi
            displayName: 'Summarise plan and flag destructive changes'
