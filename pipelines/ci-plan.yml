# CI: dry run on every PR into main. Plans every stack. Never applies.
# Environments and workload RGs: templates/environments.yml
# (In Azure Repos, PR validation comes from the branch policy; the pr: block
# below applies when the repo is hosted on GitHub.)

name: 'CI-Plan-$(Date:yyyyMMdd)$(Rev:.r)'

trigger: none

pr:
  branches:
    include: [main]
  paths:
    include: [environments, modules, pipelines, .checkov.yaml, .tflint.hcl]

variables:
  TF_VERSION: '1.16.3'
  STATE_RG: 'rg-terraform-state'
  TF_IN_AUTOMATION: 'true'

stages:
  - template: templates/environments.yml
    parameters:
      mode: ci
