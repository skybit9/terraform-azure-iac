# ══════════════════════════════════════════════════════════════════════════════
# CI — Dry run. Plans every stack in every environment. NEVER applies.
#
# Branch strategy:
#   feature/* -> PR into main -> THIS pipeline
#   main      -> merge        -> cd-apply.yml
#
# Identity: the *-plan service connections, which hold Reader on the resource
# group. A plan does not need write access, so a malicious PR adding an apply
# step cannot change Azure.
# ══════════════════════════════════════════════════════════════════════════════

name: 'CI-Plan-$(Build.SourceBranchName)-$(Date:yyyyMMdd)$(Rev:.r)'

trigger: none          # merges are CD's job

pr:
  branches:
    include: [main]
  paths:
    include:
      - 'environments/**'
      - 'modules/**'

variables:
  TF_VERSION: '1.9.8'
  STATE_RG: 'rg-terraform-state'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

stages:

  - stage: Validate
    displayName: 'Validate'
    jobs:
      - job: Static
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - task: TerraformInstaller@1
            inputs: { terraformVersion: $(TF_VERSION) }

          - script: terraform fmt -check -recursive
            displayName: 'Format check'

          - script: |
              set -e
              for env in dev staging prod; do
                for stack in networking keyvault app; do
                  echo "Validating $env/$stack"
                  cd "$(Build.SourcesDirectory)/environments/$env/$stack"
                  terraform init -backend=false    # syntax only, no backend
                  terraform validate
                done
              done
            displayName: 'Validate all stacks'

          - script: |
              curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
              tflint --init
              tflint --recursive --format compact
            displayName: 'TFLint'

  # Stacks plan in parallel: a plan is read-only and each touches a different
  # state container.
  - stage: PlanDev
    displayName: 'Plan: Dev'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: Networking
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - template: templates/plan-steps.yml
            parameters: { environmentName: 'dev', stack: 'networking', stateStorageAccount: 'stishelartfstatedev' }
      - job: KeyVault
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - template: templates/plan-steps.yml
            parameters: { environmentName: 'dev', stack: 'keyvault', stateStorageAccount: 'stishelartfstatedev' }
      - job: App
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - template: templates/plan-steps.yml
            parameters: { environmentName: 'dev', stack: 'app', stateStorageAccount: 'stishelartfstatedev' }

  - stage: PlanStaging
    displayName: 'Plan: Staging'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: Networking
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - template: templates/plan-steps.yml
            parameters: { environmentName: 'staging', stack: 'networking', stateStorageAccount: 'stishelartfstatestaging' }
      - job: KeyVault
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - template: templates/plan-steps.yml
            parameters: { environmentName: 'staging', stack: 'keyvault', stateStorageAccount: 'stishelartfstatestaging' }
      - job: App
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - template: templates/plan-steps.yml
            parameters: { environmentName: 'staging', stack: 'app', stateStorageAccount: 'stishelartfstatestaging' }

  - stage: PlanProd
    displayName: 'Plan: Production'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: Networking
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - template: templates/plan-steps.yml
            parameters: { environmentName: 'prod', stack: 'networking', stateStorageAccount: 'stishelartfstateprod' }
      - job: KeyVault
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - template: templates/plan-steps.yml
            parameters: { environmentName: 'prod', stack: 'keyvault', stateStorageAccount: 'stishelartfstateprod' }
      - job: App
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - template: templates/plan-steps.yml
            parameters: { environmentName: 'prod', stack: 'app', stateStorageAccount: 'stishelartfstateprod' }
