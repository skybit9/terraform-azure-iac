# ══════════════════════════════════════════════════════════════════════════════
# CI: dry run. Plans every stack in every environment. NEVER applies.
#   feature/* -> PR into main -> this pipeline
#   main      -> merge        -> cd-apply.yml
# ══════════════════════════════════════════════════════════════════════════════

name: 'CI-Plan-$(Date:yyyyMMdd)$(Rev:.r)'

trigger: none

pr:
  branches:
    include: [main]
  paths:
    include: [environments, modules, pipelines, .checkov.yaml, .tflint.hcl]

parameters:
  - name: environments
    type: object
    default: [dev, staging, prod]
  - name: stacks
    type: object
    default: [networking, keyvault, app]

variables:
  TF_VERSION: '1.16.3'
  STATE_RG: 'rg-terraform-state'
  TF_IN_AUTOMATION: 'true'

stages:
  - stage: Validate
    displayName: 'Validate'
    jobs:
      - job: Static
        pool: {vmImage: ubuntu-latest}
        steps:
          - task: TerraformInstaller@1
            inputs: {terraformVersion: $(TF_VERSION)}

          - script: terraform fmt -check -recursive -diff
            displayName: 'Format check'

          - ${{ each env in parameters.environments }}:
              - ${{ each stack in parameters.stacks }}:
                  - script: |
                      set -euo pipefail
                      terraform init -backend=false -input=false
                      terraform validate
                    displayName: 'Validate ${{ env }}/${{ stack }}'
                    workingDirectory: '$(Build.SourcesDirectory)/environments/${{ env }}/${{ stack }}'

          - script: |
              set -euo pipefail
              curl -sSL https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
              tflint --init --config "$(Build.SourcesDirectory)/.tflint.hcl"
              tflint --recursive --config "$(Build.SourcesDirectory)/.tflint.hcl" --format compact
            displayName: 'TFLint'
            env:
              GITHUB_TOKEN: $(System.AccessToken)

  # Plans are read only and each stack has its own state container, so every
  # environment and stack plans in parallel.
  - ${{ each env in parameters.environments }}:
      - stage: Plan_${{ env }}
        displayName: 'Plan: ${{ env }}'
        dependsOn: Validate
        jobs:
          - ${{ each stack in parameters.stacks }}:
              - job: ${{ stack }}
                displayName: '${{ stack }}'
                pool: {vmImage: ubuntu-latest}
                steps:
                  - template: templates/plan-steps.yml
                    parameters:
                      environmentName: ${{ env }}
                      stack: ${{ stack }}
